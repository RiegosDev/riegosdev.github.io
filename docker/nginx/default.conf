server {
    listen 80;
    server_name dotf4p.com www.dotf4p.com n8n.dotf4p.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name dotf4p.com www.dotf4p.com;

    ssl_certificate /etc/letsencrypt/live/dotf4p.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dotf4p.com/privkey.pem;

    location / {
        proxy_pass http://app:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
    }
}

server {
    listen 443 ssl;
    server_name n8n.dotf4p.com;

    ssl_certificate /etc/letsencrypt/live/dotf4p.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dotf4p.com/privkey.pem;

    location / {
        proxy_pass http://n8n:5678;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;
    }
}
